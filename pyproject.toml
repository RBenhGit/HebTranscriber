[project]
name = "hebtranscriber"
version = "0.1.0"
description = "Local, offline-first Hebrew transcription and cleanup (Whisper + local LLM)"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0",
    "requests>=2.31",
    "psutil>=5.9",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "silero-vad>=6.0",
    "pyperclip>=1.9",
    "flet>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Optional: global hotkey (Ctrl+Shift+D) support in the GUI. Not a core
# dependency because pynput's Linux backend needs to compile `evdev` against
# kernel headers (a C compiler + build-essential), which many systems lack;
# the GUI already degrades gracefully (a status message, not a crash) when
# pynput is missing.
hotkey = [
    "pynput>=1.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
